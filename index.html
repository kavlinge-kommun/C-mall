<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cmall — Referenser</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #f8fafc;
    color: #1a1a2e;
    min-height: 100vh;
    padding: 24px 20px;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0f172a, #1e3a5f);
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(15,23,42,0.2);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-title h1 {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .header-meta {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin-top: 3px;
  }
  .import-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .import-btn:hover { background: rgba(255,255,255,0.22); }

  /* Stats */
  .stats-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-val { font-size: 20px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 2px; letter-spacing: 0.5px; text-transform: uppercase; }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
  .search-input {
    width: 100%;
    padding: 12px 40px 12px 44px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: #1e3a5f; }
  .search-clear {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    border: none; background: none; cursor: pointer; font-size: 20px; color: #94a3b8; line-height: 1;
    display: none;
  }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 15px;
    border-radius: 8px;
    border: 2px solid #e2e8f0;
    background: #fff;
    color: #64748b;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active {
    border-color: #1e3a5f;
    background: #1e3a5f;
    color: #fff;
  }

  /* Result count */
  .result-info { font-size: 12px; color: #94a3b8; margin-bottom: 10px; padding-left: 2px; }
  .result-info strong { color: #1e3a5f; }

  /* Table */
  .table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #0f172a; }
  thead th {
    padding: 13px 18px;
    text-align: left;
    color: #e2e8f0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: #1e3a5f; }
  .sort-arrow { margin-left: 4px; opacity: 0.35; font-size: 11px; }
  .sort-arrow.active { opacity: 1; }
  tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
  tbody tr:hover { background: #f0f7ff !important; }
  tbody tr.vakant-row { background: #fafafa; }
  td { padding: 11px 18px; font-size: 14px; }
  td.num-col { font-family: 'Courier New', monospace; font-size: 13px; color: #1e3a5f; font-weight: 700; width: 140px; }
  td.name-col { color: #1e293b; }
  td.name-col.vakant { color: #94a3b8; font-style: italic; }
  td.type-col { width: 120px; }
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
  }
  .badge-person { background: #dcfce7; color: #15803d; }
  .badge-vakant { background: #fee2e2; color: #dc2626; }
  .badge-roll   { background: #dbeafe; color: #1d4ed8; }
  mark { background: #fde68a; border-radius: 2px; padding: 0 1px; }
  .no-results { text-align: center; padding: 48px; color: #94a3b8; font-size: 15px; }
  .no-results .icon { font-size: 32px; margin-bottom: 8px; }

  /* Drag overlay */
  #drag-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(30,58,95,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  #drag-overlay.active { display: flex; }
  #drag-overlay .drop-icon { font-size: 56px; }
  #drag-overlay p { color: #fff; font-size: 20px; font-weight: 700; }

  /* Toast */
  #toast {
    display: none;
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 20px; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 1000;
    font-family: inherit;
  }
</style>
</head>
<body>

<div id="drag-overlay">
  <div class="drop-icon">📂</div>
  <p>Släpp filen här för att importera</p>
</div>

<div id="toast"></div>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">
        <span style="font-size:24px">📋</span>
        <h1>Cmail — Katalog</h1>
      </div>
      <div class="header-meta" id="header-meta"></div>
    </div>
    <button class="import-btn" onclick="document.getElementById('file-input').click()">
      ⬆ Importera ny fil
    </button>
    <input id="file-input" type="file" accept=".json,.csv,.txt" style="display:none" onchange="onFileChange(event)">
  </div>
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="stat-total" style="color:#94a3b8">0</div><div class="stat-label">Totalt</div></div>
    <div class="stat"><div class="stat-val" id="stat-person" style="color:#4ade80">0</div><div class="stat-label">Personer</div></div>
    <div class="stat"><div class="stat-val" id="stat-vakant" style="color:#f87171">0</div><div class="stat-label">Vakanta</div></div>
    <div class="stat"><div class="stat-val" id="stat-roll" style="color:#60a5fa">0</div><div class="stat-label">Roller/System</div></div>
  </div>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" id="search" type="text" placeholder="Sök på namn eller nummer…" oninput="onSearch()">
  <button class="search-clear" id="search-clear" onclick="clearSearch()">×</button>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('alla', this)">Alla</button>
  <button class="filter-btn" onclick="setFilter('person', this)">👤 Personer</button>
  <button class="filter-btn" onclick="setFilter('vakant', this)">⚪ Vakant</button>
  <button class="filter-btn" onclick="setFilter('roll', this)">🏷 Roller/System</button>
</div>

<div class="result-info" id="result-info"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="toggleSort('num')" style="width:140px">
          Nummer <span class="sort-arrow active" id="arrow-num">↑</span>
        </th>
        <th onclick="toggleSort('name')">
          Namn <span class="sort-arrow" id="arrow-name">↕</span>
        </th>
        <th style="width:120px">Typ</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="no-results" id="no-results" style="display:none">
    <div class="icon">🔎</div>
    Inga träffar
  </div>
</div>

// ── STATE ────────────────────────────────────────────────────────────
let entries = parseEntries(RAW_DEFAULT);
let currentFilter = 'alla';
let sortField = 'num';
let sortAsc = true;
let searchQuery = '';
let importedAt = null;
let importedFile = null;

const STORAGE_KEY = 'cmail-data-v1';
const STORAGE_META_KEY = 'cmail-meta-v1';

// ── PARSE ────────────────────────────────────────────────────────────
function parseEntries(raw) {
  return raw.trim().split('\n').map(line => {
    const idx = line.indexOf(', ');
    const num = idx > -1 ? line.slice(0, idx).trim() : line.trim();
    const name = idx > -1 ? line.slice(idx + 2).trim() : '';
    return { num, name };
  }).filter(e => e.num);
}

function parseJSONFile(text) {
  try {
    const json = JSON.parse(text);
    if (Array.isArray(json)) {
      return json.map(row => {
        const keys = Object.keys(row);
        return { num: String(row[keys[0]] || '').trim(), name: String(row[keys[1]] || '').trim() };
      }).filter(e => e.num);
    }
  } catch(_) {}
  // fallback: CSV-liknande
  const lines = text.trim().split('\n').slice(1);
  return lines.map(line => {
    const parts = line.split(',');
    if (parts.length < 2) return null;
    return { num: parts[0].trim(), name: parts[1].trim() };
  }).filter(e => e && e.num);
}

// ── CLASSIFY ─────────────────────────────────────────────────────────
function getType(name) {
  if (!name) return 'roll';
  const l = name.toLowerCase();
  if (l.startsWith('vakant') || l.startsWith('(vakant') || l.includes('vaknat')) return 'vakant';
  const roles = ['fastighet','teknisk chef','miljöchef','omsorgscontroller','systemförvaltare',
    'bygg & miljö','bibliotekschef','idrottsanläggning','samhällsbyggnad','möllebacken',
    'advania','folksam','tele2','idrott och hälsa','korsbacka','övergripande it',
    'skönadal förskola','skönadalskolan','va-chef','sekretess','bil','används ej'];
  if (roles.some(r => l.includes(r))) return 'roll';
  if (/^[A-Z0-9_\-\.]+$/.test(name) && name.length < 10) return 'roll';
  return 'person';
}

// ── HIGHLIGHT ─────────────────────────────────────────────────────────
function hlText(text, q) {
  if (!q || !text) return text || '';
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

// ── STORAGE ───────────────────────────────────────────────────────────
function saveToStorage() {
  try {
    const raw = entries.map(e => `${e.num}, ${e.name}`).join('\n');
    localStorage.setItem(STORAGE_KEY, raw);
    localStorage.setItem(STORAGE_META_KEY, JSON.stringify({ importedAt, filename: importedFile }));
  } catch(_) {}
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const meta = localStorage.getItem(STORAGE_META_KEY);
    if (raw) {
      const parsed = parseEntries(raw);
      if (parsed.length > 5) entries = parsed;
    }
    if (meta) {
      const m = JSON.parse(meta);
      importedAt = m.importedAt;
      importedFile = m.filename;
    }
  } catch(_) {}
}

// ── RENDER ────────────────────────────────────────────────────────────
function render() {
  const lq = searchQuery.toLowerCase();

  let list = entries.filter(e => {
    const type = getType(e.name);
    if (currentFilter !== 'alla' && type !== currentFilter) return false;
    if (!lq) return true;
    return e.num.toLowerCase().includes(lq) || e.name.toLowerCase().includes(lq);
  });

  list.sort((a, b) => {
    const va = sortField === 'num' ? a.num : a.name.toLowerCase();
    const vb = sortField === 'num' ? b.num : b.name.toLowerCase();
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  // Stats
  const counts = { person: 0, vakant: 0, roll: 0 };
  entries.forEach(e => { counts[getType(e.name)]++; });
  document.getElementById('stat-total').textContent = entries.length;
  document.getElementById('stat-person').textContent = counts.person;
  document.getElementById('stat-vakant').textContent = counts.vakant;
  document.getElementById('stat-roll').textContent = counts.roll;

  // Meta
  const metaEl = document.getElementById('header-meta');
  if (importedAt) {
    const d = new Date(importedAt).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' });
    metaEl.textContent = `Uppdaterad ${d} · ${importedFile}`;
  } else {
    metaEl.textContent = '';
  }

  // Result count
  document.getElementById('result-info').innerHTML =
    `Visar <strong>${list.length}</strong> av <strong>${entries.length}</strong> poster` +
    `<span style="margin-left:12px;color:#cbd5e1">· Dra och släpp en fil var som helst för att importera</span>`;

  // Table
  const tbody = document.getElementById('tbody');
  const noRes = document.getElementById('no-results');

  if (list.length === 0) {
    tbody.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  const badgeMap = {
    person: '<span class="badge badge-person">Person</span>',
    vakant: '<span class="badge badge-vakant">Vakant</span>',
    roll:   '<span class="badge badge-roll">Roll/System</span>',
  };

  tbody.innerHTML = list.map(e => {
    const type = getType(e.name);
    const isVakant = type === 'vakant';
    return `<tr class="${isVakant ? 'vakant-row' : ''}" 
      onmouseover="this.style.background='#f0f7ff'" 
      onmouseout="this.style.background='${isVakant ? '#fafafa' : '#fff'}'">
      <td class="num-col">${hlText(e.num, searchQuery)}</td>
      <td class="name-col ${isVakant ? 'vakant' : ''}">${hlText(e.name || '—', searchQuery)}</td>
      <td class="type-col">${badgeMap[type]}</td>
    </tr>`;
  }).join('');
}

// ── SEARCH ────────────────────────────────────────────────────────────
function onSearch() {
  searchQuery = document.getElementById('search').value;
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  render();
}

function clearSearch() {
  document.getElementById('search').value = '';
  searchQuery = '';
  document.getElementById('search-clear').style.display = 'none';
  render();
}

// ── FILTER ────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── SORT ──────────────────────────────────────────────────────────────
function toggleSort(field) {
  if (sortField === field) {
    sortAsc = !sortAsc;
  } else {
    sortField = field;
    sortAsc = true;
  }
  document.querySelectorAll('.sort-arrow').forEach(el => {
    el.classList.remove('active');
    el.textContent = '↕';
  });
  const arrow = document.getElementById('arrow-' + field);
  if (arrow) {
    arrow.classList.add('active');
    arrow.textContent = sortAsc ? '↑' : '↓';
  }
  render();
}

// ── IMPORT ────────────────────────────────────────────────────────────
function onFileChange(e) {
  const file = e.target.files[0];
  if (file) handleFile(file);
  e.target.value = '';
}

async function handleFile(file) {
  const text = await file.text();
  let parsed = [];

  if (file.name.endsWith('.json')) {
    parsed = parseJSONFile(text);
  } else {
    parsed = parseEntries(text);
  }

  if (parsed.length < 5) {
    showToast('⚠️ Kunde inte läsa filen — kontrollera formatet', '#dc2626');
    return;
  }

  entries = parsed;
  importedAt = new Date().toISOString();
  importedFile = file.name;
  saveToStorage();
  render();
  showToast(`✓ ${parsed.length} poster importerade från ${file.name}`, '#15803d');
}

// ── DRAG & DROP ───────────────────────────────────────────────────────
let dragCounter = 0;
document.addEventListener('dragenter', () => {
  dragCounter++;
  document.getElementById('drag-overlay').classList.add('active');
});
document.addEventListener('dragleave', () => {
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    document.getElementById('drag-overlay').classList.remove('active');
  }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  document.getElementById('drag-overlay').classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

// ── TOAST ─────────────────────────────────────────────────────────────
function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// ── INIT ──────────────────────────────────────────────────────────────
loadFromStorage();
render();
</script>
