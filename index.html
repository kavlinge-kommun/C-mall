// ── STATUS HELPERS ────────────────────────────────────────────────────
function normStatus(s) {
  const t = (s || '').toString().toLowerCase();
  if (t.includes('sakn')) return 'saknas';
  if (t.includes('spärr') || t.includes('sparr')) return 'sparrat';
  return 'aktiv';
}
function recipBad(r) { return r.st === 'sparrat' || r.st === 'saknas'; }
function mallTveksam(m) { return (m.recips || []).some(recipBad); }
function mallStatus(m) {
  const rs = m.recips || [];
  if (rs.some(r => r.st === 'saknas')) return 'saknas';
  if (rs.some(r => r.st === 'sparrat')) return 'sparrat';
  if (rs.length === 0) return 'okand';
  return 'aktiv';
}

// ── IMPORT / PARSE ────────────────────────────────────────────────────
// Tar en platt lista (en rad per mottagare) och grupperar per CIRKMALLSID.
function groupFlat(flat) {
  const map = new Map();
  for (const d of flat) {
    if (!d.num) continue;
    if (!map.has(d.num)) map.set(d.num, { num: d.num, besk: d.besk || '', recips: [] });
    const m = map.get(d.num);
    if (!m.besk && d.besk) m.besk = d.besk;
    if (d.sig || d.namn || d.epost || d.st) {
      m.recips.push({
        ord: d.ord || 0, ser: d.ser || '', sig: d.sig || '',
        namn: d.namn || '', epost: d.epost || '', st: normStatus(d.st)
      });
    }
  }
  return [...map.values()];
}

function keyMatch(keys, cands) {
  for (const k of keys) {
    const lk = k.toLowerCase();
    if (cands.some(c => lk.includes(c))) return k;
  }
  return null;
}
function colMap(keys) {
  return {
    num:   keyMatch(keys, ['cirkmall', 'cirkid', 'nummer', 'num', 'id']) || keys[0],
    besk:  keyMatch(keys, ['beskr', 'desc']),
    ord:   keyMatch(keys, ['ordning', 'ord']),
    ser:   keyMatch(keys, ['seriell', 'ser']),
    sig:   keyMatch(keys, ['signatur', 'anvä', 'anva', 'sign', 'sig']),
    namn:  keyMatch(keys, ['namn', 'name']),
    epost: keyMatch(keys, ['epost', 'e-post', 'mail', 'post']),
    st:    keyMatch(keys, ['status'])
  };
}
function mapObj(o, m) {
  const g = k => (k && o[k] != null) ? String(o[k]).trim() : '';
  return {
    num: g(m.num), besk: g(m.besk), ord: parseInt(g(m.ord)) || 0, ser: g(m.ser),
    sig: g(m.sig), namn: g(m.namn), epost: g(m.epost), st: g(m.st)
  };
}

function splitCSVLine(line, delim) {
  const out = []; let cur = ''; let q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === delim) { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

function pickDelim(line) {
  const cand = { ',': line.split(',').length, ';': line.split(';').length, '\t': line.split('\t').length };
  let best = ',', bestN = 0;
  for (const d in cand) if (cand[d] > bestN) { bestN = cand[d]; best = d; }
  return best;
}
function looksLikeHeader(cells) {
  return cells.some(h => /cirk|besk|namn|status|signat|ordn|seri|post|mail|epost|användare|anvandare/i.test(h));
}

// Rubriklös kolumnfil (t.ex. PAD utan kolumnnamn): identifiera roller via innehåll.
function detectHeaderless(rows) {
  const n = rows[0].length;
  const sample = rows.slice(0, Math.min(rows.length, 25));
  const val = (r, i) => (r[i] || '').trim();
  const hit = (i, re) => sample.filter(r => re.test(val(r, i))).length;
  const most = Math.ceil(sample.length * 0.6);

  // E-post = kolumnen som oftast innehåller @
  let idxEpost = -1, bestAt = 0;
  for (let i = 0; i < n; i++) { const c = hit(i, /@/); if (c > bestAt) { bestAt = c; idxEpost = i; } }
  // Status = kolumn med status-ord (leta bakifrån, oftast sist)
  let idxStatus = -1;
  for (let i = n - 1; i >= 0; i--) { if (hit(i, /^(aktiv|spärr|sparr|saknas|okänd)/i) >= most) { idxStatus = i; break; } }
  // Seriell = Ja/Nej-kolumn
  let idxSer = -1;
  for (let i = 0; i < n; i++) { if (hit(i, /^(ja|nej)$/i) >= most) { idxSer = i; break; } }
  // Ordning = heltalskolumn (ej nummer i kol 0), före seriell om möjligt
  let idxOrd = -1;
  for (let i = 2; i < n; i++) { if (i === idxSer) continue; if (hit(i, /^\d+$/) >= most) { idxOrd = i; break; } }
  // Namn = kolumnen precis före e-post
  const idxNamn = idxEpost > 1 ? idxEpost - 1 : -1;
  const idxNum = 0, idxBesk = 1;
  // Signatur = kort alfanumeriskt (2–4 tecken, ej rena siffror), ej redan tilldelad
  const used = [idxNum, idxBesk, idxEpost, idxStatus, idxSer, idxOrd, idxNamn];
  let idxSig = -1;
  for (let i = 2; i < n; i++) {
    if (used.includes(i)) continue;
    const c = sample.filter(r => { const v = val(r, i); return v.length >= 2 && v.length <= 4 && /[A-Za-z0-9]/.test(v) && !/^\d+$/.test(v) && !/\s/.test(v); }).length;
    if (c >= Math.ceil(sample.length * 0.5)) { idxSig = i; break; }
  }
  return { idxNum, idxBesk, idxOrd, idxSer, idxSig, idxNamn, idxEpost, idxStatus };
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.length);
  if (!lines.length) return [];
  const delim = pickDelim(lines[0]);
  const rows = lines.map(l => splitCSVLine(l, delim).map(c => c.trim()));
  const header = rows[0];
  const flat = [];

  if (looksLikeHeader(header)) {
    // Riktig rubrikrad → mappa via kolumnnamn (tål valfri ordning och extra kolumner)
    const m = colMap(header);
    const idx = k => k ? header.indexOf(k) : -1;
    const c = { num: idx(m.num), besk: idx(m.besk), ord: idx(m.ord), ser: idx(m.ser),
                sig: idx(m.sig), namn: idx(m.namn), ep: idx(m.epost), st: idx(m.st) };
    for (const p of rows.slice(1)) {
      const at = i => (i >= 0 && i < p.length) ? p[i] : '';
      if (!at(c.num)) continue;
      flat.push({ num: at(c.num), besk: at(c.besk), ord: parseInt(at(c.ord)) || 0, ser: at(c.ser),
        sig: at(c.sig), namn: at(c.namn), epost: at(c.ep), st: at(c.st) });
    }
  } else if (header.length >= 5) {
    // Rubriklös men flerkolumns (t.ex. PAD) → identifiera kolumner via innehåll
    const d = detectHeaderless(rows);
    const at = (p, i) => (i >= 0 && i < p.length) ? p[i] : '';
    for (const p of rows) {
      if (!at(p, d.idxNum)) continue;
      flat.push({ num: at(p, d.idxNum), besk: at(p, d.idxBesk), ord: parseInt(at(p, d.idxOrd)) || 0,
        ser: at(p, d.idxSer), sig: at(p, d.idxSig), namn: at(p, d.idxNamn),
        epost: at(p, d.idxEpost), st: at(p, d.idxStatus) });
    }
  } else {
    // Äldre 2-kolumnsformat: "nummer, beskrivning"
    for (const p of rows) {
      if (!p[0]) continue;
      flat.push({ num: p[0], besk: p[1] || '', ord: 0, ser: '', sig: '', namn: '', epost: '', st: '' });
    }
  }
  return groupFlat(flat);
}

// Avkoda bytes med rätt teckenkodning (PAD sparar ofta UTF-16 med BOM).
function decodeBytes(buf) {
  const b = new Uint8Array(buf);
  try {
    if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
    if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  } catch (_) {}
  return new TextDecoder('utf-8').decode(buf);
}

function parseImport(text) {
  text = text.replace(/^\uFEFF/, '');
  try {
    const j = JSON.parse(text);
    if (Array.isArray(j) && j.length && typeof j[0] === 'object') {
      const m = colMap(Object.keys(j[0]));
      const g = groupFlat(j.map(o => mapObj(o, m)));
      if (g.length) return g;
    }
  } catch (_) {}
  return parseCSV(text);
}

// ── STORAGE ───────────────────────────────────────────────────────────
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(malls));
    localStorage.setItem(STORAGE_META_KEY, JSON.stringify({ importedAt, filename: importedFile }));
  } catch (_) {}
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); if (Array.isArray(p) && p.length > 5) malls = p; }
    const meta = localStorage.getItem(STORAGE_META_KEY);
    if (meta) { const m = JSON.parse(meta); importedAt = m.importedAt; importedFile = m.filename; }
  } catch (_) {}
}

// ── RENDER HELPERS ────────────────────────────────────────────────────
function esc(s) { return (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function hlText(t, q) {
  const safe = esc(t);
  if (!q) return safe;
  const e = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp('(' + e + ')', 'gi'), '<mark>$1</mark>');
}

function renderRecips(m, q) {
  const rs = (m.recips || []).slice();
  if (!rs.length) return '<span class="muted">—</span>';
  const seriell = rs.some(r => /ja/i.test(r.ser));
  rs.sort((a, b) => a.ord - b.ord);
  const sep = seriell ? ' <span class="chain-arrow">→</span> ' : ', ';
  return rs.map(r => {
    const bad = recipBad(r);
    const label = r.namn || r.sig || '—';
    const tip = r.st === 'saknas' ? 'Signaturen finns inte i ANV' : 'Kontot är spärrat i ANV';
    const icon = bad ? ' <span class="warn-dot" title="' + tip + '">⚠</span>' : '';
    return '<span class="recip' + (bad ? ' recip-bad' : '') + '">' + hlText(label, q) + icon + '</span>';
  }).join(sep);
}

function renderEmails(m, q) {
  const set = [...new Set((m.recips || []).map(r => r.epost).filter(Boolean))];
  if (!set.length) return '<span class="muted">—</span>';
  return set.map(e => '<div class="email">' + hlText(e, q) + '</div>').join('');
}

function statusBadge(m) {
  const s = mallStatus(m);
  if (s === 'aktiv')   return '<span class="badge badge-aktiv">Aktiv</span>';
  if (s === 'sparrat') return '<span class="badge badge-tveksam">⚠ Spärrat konto</span>';
  if (s === 'saknas')  return '<span class="badge badge-tveksam">⚠ Saknas i ANV</span>';
  return '<span class="badge badge-okand">Okänd</span>';
}

// ── RENDER ────────────────────────────────────────────────────────────
function render() {
  const lq = searchQuery.toLowerCase();

  let list = malls.filter(m => {
    if (currentFilter === 'tveksam' && !mallTveksam(m)) return false;
    if (currentFilter === 'aktiv' && (mallTveksam(m) || !(m.recips && m.recips.length))) return false;
    if (!lq) return true;
    if (m.num.toLowerCase().includes(lq)) return true;
    if ((m.besk || '').toLowerCase().includes(lq)) return true;
    return (m.recips || []).some(r =>
      (r.namn || '').toLowerCase().includes(lq) ||
      (r.epost || '').toLowerCase().includes(lq) ||
      (r.sig || '').toLowerCase().includes(lq));
  });

  list.sort((a, b) => {
    const va = sortField === 'besk' ? (a.besk || '').toLowerCase() : a.num;
    const vb = sortField === 'besk' ? (b.besk || '').toLowerCase() : b.num;
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  // Stats
  const total = malls.length;
  const tveksam = malls.filter(mallTveksam).length;
  const aktiva = malls.filter(m => !mallTveksam(m) && m.recips && m.recips.length).length;
  const kedjor = malls.filter(m => (m.recips || []).length > 1).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-aktiv').textContent = aktiva;
  document.getElementById('stat-tveksam').textContent = tveksam;
  document.getElementById('stat-kedjor').textContent = kedjor;

  // Meta
  const metaEl = document.getElementById('header-meta');
  if (importedAt) {
    const d = new Date(importedAt).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' });
    metaEl.textContent = 'Uppdaterad ' + d + (importedFile ? ' · ' + importedFile : '');
  } else {
    metaEl.textContent = '';
  }

  // Result count
  document.getElementById('result-info').innerHTML =
    'Visar <strong>' + list.length + '</strong> av <strong>' + malls.length + '</strong> mallar' +
    '<span style="margin-left:12px;color:#cbd5e1">· Dra och släpp en fil var som helst för att importera</span>';

  // Table
  const tbody = document.getElementById('tbody');
  const noRes = document.getElementById('no-results');
  if (list.length === 0) { tbody.innerHTML = ''; noRes.style.display = 'block'; return; }
  noRes.style.display = 'none';

  tbody.innerHTML = list.map(m => {
    const bad = mallTveksam(m);
    return '<tr class="' + (bad ? 'bad-row' : '') + '">' +
      '<td class="num-col">' + hlText(m.num, searchQuery) + '</td>' +
      '<td class="besk-col">' + (m.besk ? hlText(m.besk, searchQuery) : '<span class="muted">—</span>') + '</td>' +
      '<td class="recip-col">' + renderRecips(m, searchQuery) + '</td>' +
      '<td class="email-col">' + renderEmails(m, searchQuery) + '</td>' +
      '<td class="status-col">' + statusBadge(m) + '</td>' +
    '</tr>';
  }).join('');
}

// ── SEARCH ────────────────────────────────────────────────────────────
function onSearch() {
  searchQuery = document.getElementById('search').value;
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  render();
}
function clearSearch() {
  document.getElementById('search').value = '';
  searchQuery = '';
  document.getElementById('search-clear').style.display = 'none';
  render();
}

// ── FILTER ────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── SORT ──────────────────────────────────────────────────────────────
function toggleSort(field) {
  if (sortField === field) { sortAsc = !sortAsc; }
  else { sortField = field; sortAsc = true; }
  document.querySelectorAll('.sort-arrow').forEach(el => { el.classList.remove('active'); el.textContent = '↕'; });
  const arrow = document.getElementById('arrow-' + field);
  if (arrow) { arrow.classList.add('active'); arrow.textContent = sortAsc ? '↑' : '↓'; }
  render();
}

// ── IMPORT ────────────────────────────────────────────────────────────
function onFileChange(e) {
  const file = e.target.files[0];
  if (file) handleFile(file);
  e.target.value = '';
}
async function handleFile(file) {
  const buf = await file.arrayBuffer();
  const text = decodeBytes(buf);
  const parsed = parseImport(text);
  if (!parsed || parsed.length < 5) {
    showToast('Kunde inte läsa filen — kontrollera formatet', '#dc2626');
    return;
  }
  malls = parsed;
  importedAt = new Date().toISOString();
  importedFile = file.name;
  saveToStorage();
  render();
  showToast('✓ ' + parsed.length + ' mallar importerade från ' + file.name, '#15803d');
}

// ── DRAG & DROP ───────────────────────────────────────────────────────
let dragCounter = 0;
document.addEventListener('dragenter', () => {
  dragCounter++;
  document.getElementById('drag-overlay').classList.add('active');
});
document.addEventListener('dragleave', () => {
  dragCounter--;
  if (dragCounter <= 0) { dragCounter = 0; document.getElementById('drag-overlay').classList.remove('active'); }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  document.getElementById('drag-overlay').classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

// ── TOAST ─────────────────────────────────────────────────────────────
function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// ── INIT ──────────────────────────────────────────────────────────────
loadFromStorage();
render();
</script>
</body>
</html>
